# The container is privileged, so systemd sees the host's hardware watchdog.
# On shutdown it arms it (RebootWatchdogSec defaults to 10min) and the container
# exits without disarming it, which resets the whole host 10 minutes after every
# container stop/restart. The host owns the watchdog, not the container.
[Manager]
RuntimeWatchdogSec=off
RebootWatchdogSec=off
KExecWatchdogSec=off
